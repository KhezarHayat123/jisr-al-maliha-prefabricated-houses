<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffbb00" />
      <stop offset="50%" stop-color="#ffd54f" />
      <stop offset="100%" stop-color="#e5a700" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Icon: Modern Modular Prefab Cube + Bridge Arch -->
  <g transform="translate(10, 10)">
    <!-- Base Chassis / Foundation -->
    <rect x="5" y="82" width="90" height="8" rx="2" fill="url(#goldGrad)" />
    <circle cx="20" cy="94" r="3" fill="#ffbb00" />
    <circle cx="50" cy="94" r="3" fill="#ffbb00" />
    <circle cx="80" cy="94" r="3" fill="#ffbb00" />

    <!-- Prefab Modular Unit -->
    <rect x="10" y="26" width="80" height="56" rx="4" fill="url(#blueGrad)" stroke="url(#goldGrad)" stroke-width="2.5" filter="url(#subtleShadow)" />
    
    <!-- Modular Corrugated Wall Grooves -->
    <line x1="26" y1="28" x2="26" y2="80" stroke="#334155" stroke-width="1.5" />
    <line x1="42" y1="28" x2="42" y2="80" stroke="#334155" stroke-width="1.5" />
    <line x1="58" y1="28" x2="58" y2="80" stroke="#334155" stroke-width="1.5" />
    <line x1="74" y1="28" x2="74" y2="80" stroke="#334155" stroke-width="1.5" />

    <!-- Window with Glow -->
    <rect x="20" y="38" width="22" height="20" rx="2" fill="#38bdf8" fill-opacity="0.85" stroke="#ffffff" stroke-width="1.2" />
    <line x1="31" y1="38" x2="31" y2="58" stroke="#ffffff" stroke-width="1" />
    <line x1="20" y1="48" x2="42" y2="48" stroke="#ffffff" stroke-width="1" />

    <!-- Modular Door -->
    <rect x="52" y="36" width="26" height="46" rx="2" fill="#1e293b" stroke="url(#goldGrad)" stroke-width="1.5" />
    <circle cx="72" cy="60" r="2" fill="#ffbb00" />

    <!-- Stylized "Jisr" Bridge Golden Arch -->
    <path d="M 0 50 Q 50 -10 100 50" fill="none" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 12 50 Q 50 6 88 50" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.6" stroke-linecap="round" />

    <!-- Roof Peak -->
    <polygon points="50,14 10,26 90,26" fill="url(#goldGrad)" />
  </g>

  <!-- Typography -->
  <!-- Arabic Brand Name -->
  <text x="120" y="36" font-family="'Cairo', 'Segoe UI', Tahoma, sans-serif" font-weight="800" font-size="20" fill="#0f172a" letter-spacing="0.5">
    جسر المليحه <tspan fill="#d97706" font-size="16">لتجارة البيوت الجاهزة ذ.م.م</tspan>
  </text>

  <!-- English Brand Name -->
  <text x="120" y="68" font-family="'Plus Jakarta Sans', 'Montserrat', Arial, sans-serif" font-weight="900" font-size="25" fill="#0f172a" letter-spacing="-0.5">
    JISR AL MALIHA
  </text>

  <!-- Subtitle / Category -->
  <text x="120" y="90" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="12" fill="#b45309" letter-spacing="1.5">
    PREFABRICATED HOUSES TR. L.L.C
  </text>

  <!-- License & Trust Badge -->
  <g transform="translate(120, 98)">
    <rect x="0" y="0" width="170" height="18" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" />
    <text x="8" y="13" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="10" fill="#92400e">
      SHARJAH SEDD LIC. #922593
    </text>
  </g>
</svg>
